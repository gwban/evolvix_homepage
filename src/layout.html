<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <meta name="theme-color" content="#FBFBFD">
$head_links
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Evolvix">
  <meta property="og:locale" content="$og_locale">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:image" content="${site_url}assets/img/og-image.png">

  <link rel="icon" href="${root}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="${root}assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="${root}assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">$skip</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="$home" aria-label="$home_label">
        <img src="${root}assets/img/logo-wordmark.png" alt="Evolvix" width="417" height="93">
      </a>
      <nav class="site-nav" aria-label="$nav_label">
        <ul>
$nav
        </ul>
      </nav>
      <div class="lang-switch" role="group" aria-label="$lang_label">
$lang_switch
      </div>
    </div>
  </header>

  <main id="main">
$content
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-top">
        <a href="$home" aria-label="$home_label"><img src="${root}assets/img/logo-wordmark.png" alt="Evolvix" width="417" height="93" loading="lazy"></a>
        <nav class="footer-nav" aria-label="$footer_nav_label">
          <ul>
$nav
          </ul>
        </nav>
      </div>
      <div class="footer-info">
        <strong>$company</strong>
        <span>$ceo</span>
        <span>$address</span>
        <a href="mailto:$email">$email</a>
        <span>© $year Evolvix Inc. All rights reserved.</span>
      </div>
    </div>
  </footer>
</body>
</html>
